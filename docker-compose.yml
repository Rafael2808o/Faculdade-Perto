services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: faculdade_perto
      POSTGRES_USER: faculdade
      POSTGRES_PASSWORD: faculdade
    ports:
      - "5432:5432"
    volumes:
      - faculdade_perto_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faculdade -d faculdade_perto"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  faculdade_perto_pg:
