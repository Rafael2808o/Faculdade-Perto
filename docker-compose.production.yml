services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      DATA_MODE: database
      DATABASE_URL: postgres://faculdade:${POSTGRES_PASSWORD}@postgres:5432/faculdade_perto
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
      WEB_ORIGIN: ${PUBLIC_SITE_URL}
      TRUST_PROXY: "true"
    ports: ["3333:3333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      migrate: { condition: service_completed_successfully }
  migrate:
    build: .
    restart: "no"
    command: ["npm","run","db:migrate"]
    environment:
      NODE_ENV: production
      DATA_MODE: database
      DATABASE_URL: postgres://faculdade:${POSTGRES_PASSWORD}@postgres:5432/faculdade_perto
    depends_on:
      postgres: { condition: service_healthy }
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: faculdade_perto
      POSTGRES_USER: faculdade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["faculdade_perto_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faculdade -d faculdade_perto"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  faculdade_perto_pg:
